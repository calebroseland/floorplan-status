# Static site config for a plain nginx host (Proxmox LXC, VM, existing server).
# Install to /etc/nginx/sites-available/house-status and symlink it into
# sites-enabled. The Docker image uses docker/nginx.conf, which is the same
# thing with a different document root.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /var/www/house-status;
  index index.html;

  # Single-page app: unknown paths fall back to the shell. Everything served
  # from here keeps its name across builds — the shell, the service worker,
  # the manifest, the icons — so it must be revalidated, or an installed PWA
  # keeps running the old version forever.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets are content-addressed and safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

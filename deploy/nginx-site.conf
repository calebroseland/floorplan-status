# Static site config for a plain nginx host (Proxmox LXC, VM, existing server).
# Install to /etc/nginx/sites-available/house-status and symlink it into
# sites-enabled. The Docker image uses docker/nginx.conf, which is the same
# thing with a different document root.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /var/www/house-status;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are content-addressed and safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The shell and the service worker must never be cached, or an installed
  # PWA will keep serving the old build after you redeploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

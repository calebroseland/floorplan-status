[tools]
node = "24"

[env]
_.path = ["./node_modules/.bin"]

[tasks.setup]
description = "Install dependencies and git hooks"
run = """
npm ci
git config core.hooksPath .githooks
"""

[tasks.dev]
description = "Run the app with HMR"
run = "npm run dev --"

[tasks.build]
description = "Production build into dist/"
run = "npm run build"

[tasks.preview]
description = "Serve the production build on the LAN"
run = "npm run preview --"

[tasks.typecheck]
run = "tsc --noEmit"

[tasks.lint]
run = "biome check ."

[tasks.format]
run = "biome check --write ."

[tasks.test]
run = "vitest run"

[tasks."test:watch"]
run = "vitest"

[tasks.check]
description = "The gate: lint, typecheck, unit tests"
depends = ["lint", "typecheck", "test"]

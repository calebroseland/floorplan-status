server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths fall back to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are safe to cache hard; the shell and the service
  # worker must not be, or updates never reach an installed PWA.
  # One Cache-Control header, not `expires` plus an add_header that
  # contradicts it.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
